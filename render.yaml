services:
  # Backend API — Express server (free tier, spins down after 15min idle)
  - type: web
    name: exitus-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NODE_ENV
        value: production

  # Frontend — Static React site (free, always on)
  - type: web
    name: exitus-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_STRIPE_PRICE_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
